<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso do organizador — Amigo Oculto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <main class="container py-5" style="max-width: 28rem">
      <h1 class="h3 mb-4">Acesso do organizador</h1>
      <form id="adminLoginForm">
        <label class="form-label" for="adminPassword">Senha administrativa</label>
        <input
          class="form-control mb-3"
          id="adminPassword"
          type="password"
          autocomplete="current-password"
          required
          autofocus
        />
        <p id="loginMessage" class="text-danger" role="alert"></p>
        <button id="btnLogin" class="btn btn-primary w-100" type="submit">
          Entrar
        </button>
      </form>
    </main>
    <script src="js/geral.js"></script>
    <script src="js/auth-client.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
